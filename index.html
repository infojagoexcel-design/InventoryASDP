<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A66">
  <title>Inventori ASDP Batam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F3F6FA; color: #14204F; }
    .pre { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; }
    .pre img { width: 120px; margin-bottom: 14px; }
    .pre .bar { width: 160px; height: 4px; border-radius: 4px; background: #DCE3EE; overflow: hidden; margin: 14px auto 0; position: relative; }
    .pre .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #253B8C; animation: pre 1.1s ease-in-out infinite; }
    @keyframes pre { from { left: -40%; } to { left: 100%; } }
    .pre .msg { max-width: 380px; color: #5B6785; font-size: 14px; line-height: 1.5; }
    .pre button { margin-top: 14px; border: 0; background: #253B8C; color: #fff; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; }
    .upd { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 70; background: #14204F; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .upd button { border: 0; background: #8CC63F; color: #14204F; font: inherit; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div id="app"><div class="pre"><div><img src="icon-192.png" alt=""><div style="font-weight:700">Inventori Suku Cadang Kapal</div><div class="bar"></div><div class="msg" id="pre-msg" style="margin-top:12px">Memuat aplikasi…</div></div></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
  <script>
  /* Pembuka aplikasi terpasang (PWA). File ini tidak perlu diganti saat upgrade:
     kode aplikasi diambil dari Apps Script (?bundle=1), disimpan di HP, dan dipakai saat tanpa sinyal. */
  (function () {
    var C = window.APP_CONFIG || {};
    C.mode = 'pwa';
    window.APP_CONFIG = C;
    var KEY = 'asdp_inv_bundle';
    var msg = function (t, retry) {
      document.getElementById('app').innerHTML = '<div class="pre"><div><img src="icon-192.png" alt=""><div class="msg">' + t + '</div>' +
        (retry ? '<button onclick="location.reload()">Coba lagi</button>' : '') + '</div></div>';
    };
    if (!C.apiUrl || /GANTI_DENGAN/.test(C.apiUrl)) { msg('URL web app belum diisi di <b>config.js</b>. Hubungi Admin aplikasi.'); return; }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

    function inject(b) {
      var st = document.createElement('style'); st.textContent = b.css; document.head.appendChild(st);
      b.js.forEach(function (x) { var s = document.createElement('script'); s.text = x.code + '\n//# sourceURL=' + x.name + '.js'; document.body.appendChild(s); });
    }
    function fetchBundle() {
      return fetch(C.apiUrl + (C.apiUrl.indexOf('?') < 0 ? '?' : '&') + 'bundle=1&t=' + Date.now(), { redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (b) { if (!b || !b.ok || !b.js) throw new Error('Isi tidak valid'); return b; });
    }
    function save(b) { try { localStorage.setItem(KEY, JSON.stringify(b)); return true; } catch (e) { return false; } }
    function sameCode(a, b) { return a.version === b.version && a.css === b.css && JSON.stringify(a.js) === JSON.stringify(b.js); }
    function offerReload(v) {
      var d = document.createElement('div'); d.className = 'upd';
      d.innerHTML = '<span>Versi baru aplikasi tersedia' + (v ? ' (' + v + ')' : '') + '.</span><button>Muat ulang</button>';
      d.querySelector('button').onclick = function () { location.reload(); };
      document.body.appendChild(d);
    }
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { cached = null; }
    if (cached && cached.js) {
      inject(cached);
      if (navigator.onLine !== false) fetchBundle().then(function (b) { if (!sameCode(b, cached)) { save(b); offerReload(b.version); } }).catch(function () {});
      return;
    }
    if (navigator.onLine === false) { msg('Tidak ada sinyal. Buka aplikasi sekali saat ada sinyal agar bisa dipakai tanpa sinyal.', true); return; }
    fetchBundle().then(function (b) { save(b); inject(b); })
      .catch(function (e) { msg('Aplikasi tidak dapat dimuat dari server (' + (e && e.message) + '). Periksa koneksi, atau minta Admin memeriksa URL di config.js.', true); });
  })();
  </script>
</body>
</html>
